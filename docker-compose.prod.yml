# Production (mise en service, sous-étape Sa). Lancer :
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Voir docs/exploitation.md (guide pas à pas) et .env.production.example (réglages).

# Journaux (Se) : format compact de Docker, 10 fichiers de 20 Mo au plus par service, les plus
# anciens supprimés d'abord ; ils ne peuvent pas remplir le disque. Lecture : docker compose ... logs.
x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "10"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@db:5432/gestion_scolaire
  DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/gestion_scolaire
  AUTH_SECRET: ${AUTH_SECRET:?}
  APP_URL: https://${APP_DOMAIN:?}
  APP_TIMEZONE: Africa/Brazzaville
  STORAGE_DIR: /app/storage
  # Faux prestataires refusés en production, sauf démonstration (bandeau visible sur chaque page).
  DEMO_MODE: ${DEMO_MODE:-false}
  # Site de démonstration public (Sg) : école fictive, comptes affichés, remise à neuf chaque nuit.
  # Jamais sur l'installation d'une vraie école. Active aussi le service « demo » (COMPOSE_PROFILES=demo).
  DEMO_SITE: ${DEMO_SITE:-false}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-fake}
  SMS_API_KEY: ${SMS_API_KEY:-}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gestion_scolaire
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_scolaire"]
      interval: 5s
      retries: 20
    # Aucun port publié : la base n'est joignable que par les conteneurs.

  # Crée le rôle app_user et applique les migrations, puis s'arrête. L'app attend sa réussite.
  migrate:
    logging: *logging
    build: { context: ., target: app }
    image: gestion-scolaire-app:${APP_VERSION:-latest}
    command: ["node", "scripts/db-setup.mts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    logging: *logging
    image: gestion-scolaire-app:${APP_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    logging: *logging
    build: { context: ., target: worker }
    image: gestion-scolaire-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Site de démonstration (Sg, décision D38) : crée l'école fictive au démarrage, puis la remet à neuf
  # chaque nuit (DEMO_RESET_TIME, heure de Brazzaville). Lancé seulement avec COMPOSE_PROFILES=demo.
  demo:
    logging: *logging
    profiles: ["demo"]
    image: gestion-scolaire-worker:${APP_VERSION:-latest}
    command:
      ["node", "--import", "tsx", "--conditions=react-server", "scripts/demo-seed.mts", "--nightly"]
    restart: unless-stopped
    environment:
      <<: *app-env
      DEMO_RESET_TIME: ${DEMO_RESET_TIME:-03:30}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Sauvegardes (Sd, décision D33) : base + fichiers chaque nuit, chiffrées (restic), copiées chez
  # Backblaze B2 (tout stockage compatible S3 convient). Sauvegarde immédiate :
  #   docker compose ... run --rm backup backup        Restauration : voir docs/exploitation.md
  backup:
    logging: *logging
    build: { context: ./deploy/backup }
    image: gestion-scolaire-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      TZ: Africa/Brazzaville
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: gestion_scolaire
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      # Ex. s3:https://s3.eu-central-003.backblazeb2.com/<bucket>/gestion-scolaire
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:?}
      # Clé de chiffrement : gardée aussi par le porteur du projet (gestionnaire + copie papier).
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:?}
      AWS_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_SECRET_ACCESS_KEY:-}
      # Supervision (Se) : adresse de contrôle Healthchecks.io (alerte si échec ou absence de sauvegarde).
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - storage:/data/storage
      - backup-status:/status
      - backup-cache:/root/.cache/restic
    depends_on:
      db: { condition: service_healthy }

  # Proxy HTTPS : certificat Let's Encrypt obtenu et renouvelé automatiquement pour APP_DOMAIN.
  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  storage:
  backup-status:
  backup-cache:
  caddy-data:
  caddy-config:
