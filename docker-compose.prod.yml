# Production (mise en service, sous-étape Sa). Lancer :
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Voir docs/exploitation.md (guide pas à pas) et .env.production.example (réglages).

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD:?}@db:5432/gestion_scolaire
  DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/gestion_scolaire
  AUTH_SECRET: ${AUTH_SECRET:?}
  APP_URL: https://${APP_DOMAIN:?}
  APP_TIMEZONE: Africa/Brazzaville
  STORAGE_DIR: /app/storage
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
  PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-fake}
  SMS_API_KEY: ${SMS_API_KEY:-}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gestion_scolaire
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_scolaire"]
      interval: 5s
      retries: 20
    # Aucun port publié : la base n'est joignable que par les conteneurs.

  # Crée le rôle app_user et applique les migrations, puis s'arrête. L'app attend sa réussite.
  migrate:
    build: { context: ., target: app }
    image: gestion-scolaire-app:${APP_VERSION:-latest}
    command: ["node", "scripts/db-setup.mts"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    image: gestion-scolaire-app:${APP_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    image: gestion-scolaire-worker:${APP_VERSION:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Proxy HTTPS : certificat Let's Encrypt obtenu et renouvelé automatiquement pour APP_DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
