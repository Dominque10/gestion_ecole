name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://app_user:ci-app-password@localhost:5434/gestion_scolaire
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5434/gestion_scolaire
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_scolaire
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Chromium sert aussi aux tests d'intégration (PDF produits par le worker).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e

  # Mise en service (Sa) : images de production construites et démarrées avec Compose, puis test de
  # fumée en HTTPS contre les conteneurs (Docker ne tourne pas sur le poste de développement).
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.prod.yml -f deploy/ci/backup-local-repo.yml --env-file .env.production
      SMOKE_SUPERADMIN_EMAIL: admin@exemple.cg
      SMOKE_SUPERADMIN_PASSWORD: Mot-de-passe-ci-2026
    steps:
      - uses: actions/checkout@v4
      - name: Installation par le script d'installation (sans question, système déjà prêt)
        run: sudo -E bash deploy/install.sh --skip-system --non-interactive
        env:
          COMPOSE_EXTRA_FILE: deploy/ci/backup-local-repo.yml
          APP_DOMAIN: localhost
          ACME_EMAIL: ci@exemple.cg
          DEMO_MODE: "true"
          BACKUP_REPOSITORY: /repo
          SUPERADMIN_EMAIL: ${{ env.SMOKE_SUPERADMIN_EMAIL }}
          SUPERADMIN_NAME: Admin CI
          SUPERADMIN_PASSWORD: ${{ env.SMOKE_SUPERADMIN_PASSWORD }}
      - name: Réglages créés par l'installation, lisibles par root seul
        run: |
          test "$(stat -c %a .env.production)" = "600"
          sudo chmod 644 .env.production
          grep -q '^BACKUP_PASSWORD=[0-9a-f]\{4\}-' .env.production
      - name: Le site répond en HTTPS, HTTP redirige
        run: |
          for i in $(seq 1 60); do curl -skf https://localhost/connexion -o /dev/null && break; sleep 3; done
          curl -skf https://localhost/connexion | grep -q "Se connecter"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/connexion)" = "308"
      - name: Le worker est démarré
        run: |
          for i in $(seq 1 30); do $COMPOSE logs worker | grep -q "\[worker\] démarré" && exit 0; sleep 2; done
          $COMPOSE logs worker; exit 1
      - name: Santé du service (base, file, worker) et en-têtes de sécurité
        run: |
          for i in $(seq 1 30); do curl -skf https://localhost/api/v1/health -o /dev/null && break; sleep 2; done
          curl -skf https://localhost/api/v1/health | grep -q '"status":"ok"'
          headers=$(curl -skI https://localhost/connexion)
          echo "$headers" | grep -qi "^strict-transport-security:"
          echo "$headers" | grep -qi "^content-security-policy:.*frame-ancestors 'none'"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
      - name: Vérification du stockage des fichiers (dans les conteneurs)
        run: $COMPOSE run --rm app node scripts/storage-check.mts
      - name: Démarrage refusé avec un faux prestataire hors démonstration
        run: |
          set +e
          out=$($COMPOSE run --rm --no-deps -e DEMO_MODE=false app node_modules/.bin/next start 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "démarrage refusé"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test de fumée contre les conteneurs
        run: pnpm exec playwright test -c playwright.smoke.config.ts
        env:
          SMOKE_URL: https://localhost
      - name: "Sauvegarde puis restauration complète sur une base neuve : données identiques"
        run: |
          set -o pipefail
          # Un fichier référencé par la base (logo de l'école créée par le test de fumée).
          $COMPOSE exec -T app sh -c 'mkdir -p /app/storage/schools/ci && printf PNG > /app/storage/schools/ci/logo-1.png'
          $COMPOSE exec -T db psql -U postgres -d gestion_scolaire -c             "update schools set logo_key = 'schools/ci/logo-1.png' where lower(code) = 'verif'" | grep -q "UPDATE 1"
          $COMPOSE stop app worker
          $COMPOSE exec -T db psql -U postgres -d gestion_scolaire -At -f - < deploy/backup/fingerprint.sql > fp-avant.txt
          $COMPOSE run --rm backup backup
          # Tout effacer (base, fichiers), sauf le dépôt de sauvegarde.
          $COMPOSE down -v
          $COMPOSE up -d db
          $COMPOSE run --rm backup restore latest --confirmer | tee restauration.log
          grep -E '^[a-z_]+ [0-9]+ [0-9a-f]{32}$' restauration.log > fp-apres.txt
          diff fp-avant.txt fp-apres.txt
          test "$(wc -l < fp-apres.txt)" -gt 30
          grep -q "^schools 1 " fp-apres.txt
          $COMPOSE up -d
          $COMPOSE run --rm app node scripts/storage-check.mts
          for i in $(seq 1 30); do curl -skf https://localhost/api/v1/health -o /dev/null && break; sleep 3; done
          curl -skf https://localhost/api/v1/health | grep -q '"status":"ok"'
      - name: Journaux en cas d'échec
        if: failure()
        run: $COMPOSE ps -a && $COMPOSE logs --tail 200
      - name: Arrêt
        if: always()
        run: $COMPOSE down -v
